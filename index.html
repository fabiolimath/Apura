<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apuração 2026 · 1º turno</title>
<meta name="author" content="Luciano Victor">
<meta name="description" content="Painel de apuração 2026 (1º turno), com dados do TSE. Desenvolvido por Luciano Victor com apoio de IA (Claude, Anthropic).">
<style>
:root{
  --bg:#07090f;--bg2:#0c1019;--panel:#0f1420;--panel2:#141b2a;--line:#1f2940;--line2:#2a3652;
  --tx:#e8edf7;--tx2:#9aa8c4;--tx3:#5d6b88;--acc:#7cf2c8;--warn:#f5b942;
  --r:16px;--font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% 38%,#0d1424 0%,var(--bg) 62%);color:var(--tx);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh}
.scope select{max-width:200px;text-overflow:ellipsis}
/* header */
header{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(15,20,32,.9),rgba(7,9,15,.6));backdrop-filter:blur(8px);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.brand b{color:var(--acc)}.brand small{font-weight:500;color:var(--tx3);letter-spacing:.08em}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:3px;border-radius:12px}
.tabs button{background:none;border:0;padding:7px 14px;border-radius:9px;color:var(--tx2);cursor:pointer;transition:.18s;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.tabs button:disabled{opacity:.3;cursor:not-allowed}
.sp{flex:1}
.scope{display:flex;align-items:center;gap:8px}
.scope select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--tx)}
.live{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(124,242,200,.6);animation:pulse 2s infinite}
.dot.err{background:#ff5d6c;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(124,242,200,0)}100%{box-shadow:0 0 0 0 rgba(124,242,200,0)}}
/* main */
main{position:relative;display:grid;grid-template-columns:330px minmax(0,1fr) 350px;gap:16px;padding:16px 22px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative}
.card h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.mut{color:var(--tx2)}.sm{font-size:12px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* map */
.mapwrap{position:relative;min-height:0;border-radius:22px;border:1px solid var(--line);background:radial-gradient(600px 400px at 50% 45%,rgba(124,242,200,.045),transparent 70%),rgba(8,11,18,.55);overflow:hidden}
#map{width:100%;height:100%;display:block}
#map path{stroke:#05070c;stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .5s,opacity .3s,stroke .15s}
#map path:hover{stroke:#fff;stroke-width:1.4}
#map path.t2u{stroke:#f5b942;stroke-width:2;stroke-dasharray:5 3}
#map path.sel{stroke:var(--acc);stroke-width:2}
#map.fade{opacity:0;transform:scale(.985)}
#map{transition:opacity .22s,transform .22s}
.maptitle{position:absolute;left:18px;top:14px;pointer-events:none}
.maptitle .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.maptitle .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.back{position:absolute;right:16px;top:14px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 12px;cursor:pointer;display:none}
.back:hover{border-color:var(--acc)}
.mapsw{position:absolute;right:16px;top:58px;display:none;gap:4px;background:var(--panel);border:1px solid var(--line);padding:3px;border-radius:10px;font-size:12px}
.mapsw button{background:none;border:0;padding:5px 10px;border-radius:7px;color:var(--tx2);cursor:pointer}
.mapsw button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.legend{position:absolute;left:18px;bottom:14px;display:flex;gap:12px;flex-wrap:wrap;max-width:70%;font-size:12px;color:var(--tx2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.prog{position:absolute;right:16px;bottom:14px;width:190px;font-size:11px;color:var(--tx3);display:none}
.prog div{height:3px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.prog b{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.tip{position:fixed;pointer-events:none;background:rgba(10,14,22,.96);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:12px;z-index:20;opacity:0;transition:opacity .1s;min-width:160px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.tip b{display:block;font-size:13px;margin-bottom:3px}
/* ring */
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:.6s;flex:none}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;transition:width .6s}
.kv{display:flex;flex-direction:column;gap:11px}
.kv .l{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12.5px;color:var(--tx2)}.kv .l b{color:var(--tx);font-weight:600}
/* leader */
.hero{display:flex;gap:14px;align-items:center}
.av{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:20px;color:#04060a;flex:none}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2);margin-top:6px}
.pill.ok{color:#04120d;background:var(--acc);border-color:var(--acc)}.pill.t2{color:var(--warn);border-color:rgba(245,185,66,.5)}
.rk{display:flex;flex-direction:column;gap:10px}
.rk .it{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;align-items:center;cursor:default}
.rk .it.click{cursor:pointer}.rk .it.click:hover .nm{color:var(--acc)}
.rk .pos{color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
.rk .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.rk .nm small{color:var(--tx3);font-weight:500;margin-left:6px}
.rk .pc{font-weight:700;font-variant-numeric:tabular-nums}
.rk .b{grid-column:2/4}.rk .vt{grid-column:2/4;font-size:11px;color:var(--tx3);margin-top:-2px}
.sw{width:3px;height:100%}
footer{padding:9px 22px;border-top:1px solid var(--line);color:var(--tx3);font-size:11px;display:flex;justify-content:space-between;gap:12px}
.err{color:#ff8d98}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--line2) 37%,var(--line) 63%);background-size:400% 100%;animation:sk 1.4s infinite;border-radius:8px;height:14px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

.vr{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.vr .st{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:8px}
.vr .st.ok{background:var(--acc);color:#04120d}.vr .st.q{border:1px solid rgba(245,185,66,.5);color:var(--warn)}.vr .st.o{border:1px solid var(--line2);color:var(--tx2)}
.band{position:relative;height:8px;border-radius:8px;background:var(--line);margin-top:6px}.band i{position:absolute;top:0;height:100%;border-radius:8px;opacity:.45}.band b{position:absolute;top:-3px;width:2px;height:14px;background:#fff;border-radius:2px}
@media(min-width:641px){.mapwrap .acts{top:auto!important;bottom:58px}.prog{left:22px;right:22px;top:0;bottom:auto!important;width:auto;z-index:4}.prog #progtx{display:none}.prog div{margin-top:0;height:2px}.legend{max-width:calc(100% - 330px)}}
@media(max-width:1100px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  main{display:flex;flex-direction:column;padding:12px}
  .mapwrap{height:60vh;order:-1}
  header{flex-wrap:wrap}.tabs{overflow:auto;max-width:100%}
}

.stack{display:flex;flex-direction:column;gap:14px}.stack:empty{display:none}
.layers{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:3px;background:rgba(15,20,32,.88);border:1px solid var(--line);padding:3px;border-radius:12px;backdrop-filter:blur(8px);max-width:96%;overflow:auto}
.layers button{background:none;border:0;padding:6px 11px;border-radius:9px;color:var(--tx2);cursor:pointer;white-space:nowrap;font-size:12px;font-weight:500;transition:.15s}
.layers button:hover{color:var(--tx)}.layers button.on{background:var(--panel2);color:var(--acc);box-shadow:inset 0 0 0 1px var(--line2)}
.legend{bottom:58px}.prog{bottom:58px}
.legend .grad{display:inline-block;width:90px;height:8px;border-radius:6px;background:linear-gradient(90deg,#18213a,#7cf2c8);margin:0 6px}
.av{position:relative;overflow:hidden}.av .avi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rk .nm img.ph{width:20px;height:20px;border-radius:6px;object-fit:cover;vertical-align:-5px;margin-right:7px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 12px}
.presets button{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--tx2)}
.presets button:hover{border-color:var(--acc);color:var(--tx)}
.simrow{padding:10px 0;border-top:1px solid var(--line)}
.sl{display:grid;grid-template-columns:78px 1fr 40px;gap:8px;align-items:center;font-size:11.5px;margin-top:6px}
.sl input{width:100%;height:4px}
.eff{display:flex;flex-direction:column;gap:9px}
.er{display:grid;grid-template-columns:78px 1fr 42px;gap:2px 8px;align-items:center;font-size:12.5px}
.er .eb{display:flex;flex-direction:column;gap:3px}.er .eb .bar{height:5px}
.er .vt{grid-column:2/4;margin-top:1px}.up{color:var(--acc)}.dn{color:#ff8d98}
.tl{display:block;margin-top:12px;color:var(--acc);font-size:12.5px;text-decoration:none}.tl:hover,.tl2:hover{text-decoration:underline}
.tl2{color:inherit;text-decoration:none}
.cred{color:var(--tx2);white-space:nowrap}.cred b{color:var(--acc);font-weight:600}footer{flex-wrap:wrap}
.turns{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);padding:3px;border-radius:12px}.turns button{background:none;border:0;padding:6px 11px;border-radius:9px;color:var(--tx2);cursor:pointer;font-size:12.5px;white-space:nowrap}.turns button.on{background:var(--panel2);color:var(--acc)}.turns button:disabled{opacity:.35;cursor:not-allowed}
.srch{position:relative}.srch input{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--tx);width:160px;font-size:12.5px}.srch input:focus{outline:0;border-color:var(--acc)}
.qres{display:none;position:absolute;top:38px;left:0;width:340px;max-height:340px;overflow:auto;background:#0a0e16;border:1px solid var(--line2);border-radius:12px;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.5)}.qi{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:12.5px}.qi:hover{background:var(--panel2)}.qi span{color:var(--tx3);font-size:11px;white-space:nowrap}
.mapwrap .acts{position:absolute;right:16px;top:102px;display:flex;gap:4px}.acts button{background:rgba(15,20,32,.88);border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--tx2);cursor:pointer;font-size:12px}.acts button:hover{border-color:var(--acc);color:var(--tx)}
.toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:#0a0e16;border:1px solid var(--line2);border-radius:10px;padding:9px 14px;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none}
.legend2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--tx2);margin-top:8px}.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.rk .it.click{cursor:pointer}.rk .it.click:hover .nm{color:var(--acc)}
#map text.hl{fill:#fff;stroke:#05070c;stroke-width:3;paint-order:stroke;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
header{gap:12px;flex-wrap:nowrap}.brand{white-space:nowrap}.brand small{display:none;white-space:nowrap}.live{white-space:nowrap}.tabs button{padding:7px 10px}.scope .mut{display:none}.sp{min-width:0}
@media(max-width:640px){
  html,body{overflow-x:hidden;max-width:100%}.app{max-width:100vw;overflow-x:hidden}
  .tabs{max-width:calc(100vw - 24px);flex:0 1 auto;min-width:0}.layers{max-width:calc(100% - 16px)}
  header{padding:10px 12px;gap:8px}.brand{font-size:12px}
  .srch{flex:1 1 100%;order:5}.srch input,.srch input:focus{width:100%}.qres{width:100%}
  .scope{order:4}.live{order:6;width:100%}
  .turns{order:3}
  .mapwrap{height:68vh;border-radius:16px}
  .maptitle{left:12px;top:10px;right:96px}.maptitle .v{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{right:10px;top:10px;padding:6px 10px;font-size:12px}
  #map{height:calc(100% - 128px);margin-top:92px}
  .mapsw{right:10px;top:50px;max-width:48%;overflow:auto}.mapsw button{white-space:nowrap;padding:5px 8px;font-size:11px}
  .mapwrap .acts{left:12px;right:auto;top:50px}.acts button{padding:5px 8px;font-size:11px}#bCsv{display:none}
  .legend{left:12px;bottom:56px;max-width:calc(100% - 90px);font-size:11px;gap:6px 10px}.legend .lcap{display:none}
  .prog{display:none!important}
  .card{padding:14px}.big{font-size:28px}
  footer{flex-direction:column;gap:4px;padding:10px 12px}
  .pbox{padding:16px}
}
@media(min-width:1650px){.brand small{display:inline}.scope .mut{display:inline}}
@media(max-width:1100px){header{flex-wrap:wrap}}
.srch input{width:190px}.srch input:focus{width:300px}.srch input{transition:width .15s}
#jmodal{position:fixed;inset:0;background:rgba(3,5,10,.74);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center}#jmodal.on{display:flex}
#pmodal{position:fixed;inset:0;background:rgba(3,5,10,.74);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center}#pmodal.on{display:flex}
.pbox{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:18px;width:min(940px,94vw);max-height:92vh;overflow:auto;padding:20px 24px}
.phead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.ptit{font-size:18px;font-weight:700}
.ptabs{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);padding:3px;border-radius:11px;margin-left:auto}.ptabs button{background:none;border:0;color:var(--tx2);padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12.5px}.ptabs button.on{background:var(--acc);color:#05070c;font-weight:600}
.pclose{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:9px;width:32px;height:32px;cursor:pointer}.pclose:hover{color:#fff;border-color:var(--line2)}
#pchart{margin:10px auto 0;max-width:760px}.pleg{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;margin-top:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--tx2);cursor:default}.pchip i{width:9px;height:9px;border-radius:50%;display:inline-block}.pchip:hover{border-color:var(--line2);color:#fff}
.pocc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:3px 18px;margin-top:12px;font-size:12.5px}.po{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}.po i{width:8px;height:8px;border-radius:50%;flex:none}.po span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.po small{color:var(--tx3)}
.lsrch{width:100%;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--tx);font-size:12.5px}.lsrch:focus{outline:0;border-color:var(--acc)}
#ptip{position:fixed;z-index:90;pointer-events:none;background:#0a0e16;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12.5px;display:none;max-width:260px;line-height:1.45}
#parl{cursor:pointer}#parl:hover{border-color:var(--line2)}.psv circle{transition:opacity .15s}.psv circle:hover{stroke:#fff;stroke-width:1.4}
.xbtn{background:none;border:1px solid var(--line2);color:var(--tx2);border-radius:8px;padding:2px 8px;font-size:11px;cursor:pointer;margin-left:8px;letter-spacing:0;text-transform:none}.xbtn:hover{color:#fff;border-color:var(--acc)}
.wbtn{display:grid;place-items:center;width:34px;height:34px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx2);cursor:pointer;flex:none}.wbtn:hover{border-color:var(--acc);color:var(--tx)}.wbtn.on{border-color:var(--acc);color:var(--acc);background:var(--panel2)}
#map text.zl{font-size:7.4px;stroke-width:2.2;font-weight:600}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.jc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.jc h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.jc.big{padding:14px 16px}.jsv{width:100%;display:block}.jsv circle:hover{stroke:#fff;stroke-width:1.5}
.jempty{color:var(--tx2);font-size:12.5px;line-height:1.5;padding:18px 4px}
.extc .row+.row{margin-top:6px}
/* telas médias (notebooks de 13" a 15", ou zoom de 125% a 150%) */
@media(max-width:1440px) and (min-width:1101px){
  main{grid-template-columns:clamp(240px,21vw,330px) minmax(0,1fr) clamp(260px,23vw,350px);gap:12px;padding:12px 16px}
  header{padding:9px 16px;gap:10px}

  header{padding-top:7px;padding-bottom:7px}main{padding-top:10px;padding-bottom:10px}
  .col{gap:10px}.card{padding:12px 14px}.card h3{margin-bottom:8px}.kv{gap:8px}.big{font-size:27px}

<script>
'use strict';
const BASE='https://resultados.tse.jus.br/oficial/ele2026';
const IBGE='https://servicodados.ibge.gov.br/api/v3/malhas';
const CARGOS={
pres:{cd:'0001',ele:'6257',ele2:'6258',nome:'Presidente',maj:true},
gov:{cd:'0003',ele:'6259',ele2:'6260',nome:'Governador',maj:true},
sen:{cd:'0005',ele:'6259',nome:'Senador',maj:true},

};
const UFS={ac:['Acre','12'],al:['Alagoas','27'],ap:['Amapá','16'],am:['Amazonas','13'],ba:['Bahia','29'],ce:['Ceará','23'],df:['Distrito Federal','53'],es:['Espírito Santo','32'],go:['Goiás','52'],ma:['Maranhão','21'],mt:['Mato Grosso','51'],ms:['Mato Grosso do Sul','50'],mg:['Minas Gerais','31'],pa:['Pará','15'],pb:['Paraíba','25'],pr:['Paraná','41'],pe:['Pernambuco','26'],pi:['Piauí','22'],rj:['Rio de Janeiro','33'],rn:['Rio Grande do Norte','24'],rs:['Rio Grande do Sul','43'],ro:['Rondônia','11'],rr:['Roraima','14'],sc:['Santa Catarina','42'],sp:['São Paulo','35'],se:['Sergipe','28'],to:['Tocantins','17']};
const UFKEYS=Object.keys(UFS);
const IBGE2UF=Object.fromEntries(UFKEYS.map(k=>[UFS[k][1],k]));
UFS.zz=['Exterior','zz'];/* fora de UFKEYS: só Presidente, sem malha do IBGE */
const PCOL={PL:'#4f8cff',PT:'#ff4d5e',NOVO:'#f5b942',PSD:'#37d6a5',MDB:'#ff8a3d',PSDB:'#38c8e8',UNIÃO:'#b07cff',PP:'#8fd14f',REPUBLICANOS:'#2fb7d6',PSB:'#ff7a59',PDT:'#e86fa8',PSOL:'#d94fd0',PODE:'#7fd1b9',AVANTE:'#c8a2ff',MISSÃO:'#e0e04a',PCdoB:'#e0405a',PV:'#5fc46b','FEDERAÇÃO BRASIL DA ESPERANÇA':'#ff4d5e'};
const EXTRA=['#c9c9d6','#9bd34a','#ffb3c1','#7aa2ff','#e5c07b','#56d3c1','#ff9f68'];
const colorOf=sg=>{sg=(sg||'').toUpperCase();if(PCOL[sg])return PCOL[sg];let h=0;for(const c of sg)h=(h*31+c.charCodeAt(0))>>>0;return EXTRA[h%EXTRA.length]};
const LAYERS=[['lider','Líder','Candidato ou partido mais votado'],['margem','Margem','Diferença entre o 1º e o 2º colocado'],['decisivo','Decisivo','Onde brancos e nulos superam a margem'],['abst','Abstenção','Percentual de abstenção'],['pxg','Pres × Gov','Líder para Presidente versus líder para Governador'],['sim','2º turno','Simulador de transferência de votos']];
LAYERS.push(['bolhas','Votos absolutos','Círculos proporcionais à vantagem do líder em número de votos'],['abstvar','Abstenção 1º × 2º','Variação da abstenção entre os dois turnos']);
LAYERS.push(['virada','Viradas','Onde o líder entre os dois finalistas mudou do 1º para o 2º turno']);
LAYERS.push(['desl','Deslocamento','Mudança do 1º para o 2º turno na disputa entre os finalistas'],['cand','Candidato','Desempenho de um candidato em cada município']);

const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('pt-BR');
const N=x=>{const v=parseFloat(String(x??'').replace(',','.'));return isNaN(v)?0:v};
const fmt=x=>nf.format(Math.round(N(x)));
const isEl=x=>/^eleito/i.test(x||'');
const pc=(x,d=2)=>N(x).toFixed(d).replace('.',',')+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=s=>(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const dec=t=>{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p),c=>c.charCodeAt(0))))};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ===== dados ===== */
const cache=new Map();const inflight=new Map();
const eleOf=(cg,t)=>{t=t||S.turn;const C=CARGOS[cg];return t===2?(C.ele2||C.ele):C.ele};
const govDone=uf=>!!(S.govT2&&uf&&uf!=='br'&&!S.govT2.has(uf));
function dataUrl(uf,cg,mun,t){
  t=t||S.turn;if(t===2&&cg==='gov'&&govDone(uf))t=1;
  const C=CARGOS[cg];const e=eleOf(cg,t);const cd=(uf==='df'&&cg==='de')?'0008':C.cd;
  return `${BASE}/${e}/dados/${uf}/${mun?uf+mun:uf}-c${cd}-e00${e}-u.jws`;
}
const brpres=t=>`${BASE}/${eleOf('pres',t)}/dados/br/br-c0001-e00${eleOf('pres',t)}-u.jws`;
async function getJ(url,fresh){
  const hit=cache.get(url);if(hit&&!fresh)return hit.d;
  if(inflight.has(url)&&!fresh)return inflight.get(url);
  const sig=(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(20000):undefined;/* TSE lento: desiste em 20 s e tenta no próximo ciclo */
  const p=fetch(url,{cache:fresh?'no-cache':'default',signal:sig}).then(async r=>{
    if(!r.ok)throw new Error(r.status);
    let d=dec(await r.text());if(/-c000[678]-/.test(url))d=slim(d);cache.set(url,{d,at:Date.now()});try{jrec(url,d)}catch(e){}return d;
  }).finally(()=>inflight.delete(url));
  inflight.set(url,p);return p;
}
const getUF=(uf,cg,fresh,t)=>getJ(dataUrl(uf,cg,null,t),fresh);
const getMun=(uf,cd,cg,fresh,t)=>getJ(dataUrl(uf,cg,cd,t),fresh);
async function pool(items,n,fn){let i=0;const w=Array.from({length:n},async()=>{while(i<items.length){const k=items[i++];try{await fn(k)}catch(e){}}});await Promise.all(w)}
function slim(d){
  const c=d.carg&&d.carg[0];if(!c)return d;const all=[],pt=[],el={};
  for(const a of c.agr||[])for(const p of a.par||[]){pt.push({sg:p.sg,nm:p.nm,v:N(p.tvtn)});
    for(const k of p.cand||[]){const e=isEl(k.st);if(e)el[p.sg]=(el[p.sg]||0)+1;all.push({n:k.n,sq:k.sqcand,nm:k.nmu||k.nm,sg:p.sg,v:N(k.vap),p:N(k.pvapn),st:k.st||'',e:e})}}
  all.sort((a,b)=>b.v-a.v);
  d.__c=all.filter((x,i)=>i<40||x.e);d.__p=pt;d.__el=el;d.carg=[{cd:c.cd,nv:c.nv,qe:c.qe,agr:[]}];return d;
}
function cands(d){
  if(d.__c)return d.__c;
  const c=d.carg&&d.carg[0];if(!c)return[];const out=[];
  for(const a of c.agr||[])for(const p of a.par||[])for(const k of p.cand||[])
    out.push({n:k.n,sq:k.sqcand,nm:k.nmu||k.nm,sg:p.sg,v:N(k.vap),p:N(k.pvapn),st:k.st||'',e:isEl(k.st)});
  out.sort((a,b)=>b.v-a.v);return out;
}
function partidos(d){
  let out=[];
  if(d.__p)out=d.__p.map(x=>({...x}));
  else{const c=d.carg&&d.carg[0];if(!c)return[];
    for(const a of c.agr||[])for(const p of a.par||[])out.push({sg:p.sg,v:N(p.tvtn),nm:p.nm});}
  const t=out.reduce((s,x)=>s+x.v,0)||1;out.forEach(x=>x.p=x.v/t*100);
  return out.sort((a,b)=>b.v-a.v);
}
const sec=d=>({ts:N(d.s?.ts),st:N(d.s?.st),p:N(d.s?.pstn)});
const eleit=d=>({te:N(d.e?.te),c:N(d.e?.c),pc:N(d.e?.pcn),a:N(d.e?.a),pa:N(d.e?.pan)});
const votos=d=>({vv:N(d.v?.vv||d.v?.vvc),vb:N(d.v?.vb),vn:N(d.v?.tvn||d.v?.vn),tv:N(d.v?.tv)});
const photo=(cg,uf,sq,t)=>sq?`${BASE}/${eleOf(cg,t)}/fotos/${cg==='pres'?'br':uf}/${sq}.jpeg`:'';
const img=(cg,uf,sq,cls)=>{if(!sq)return '';const a=photo(cg,uf,sq),b=photo(cg,uf,sq,1);return `<img class="${cls}" loading="lazy" src="${a}" data-alt="${a!==b?b:''}" onerror="var x=this.dataset.alt;if(x){this.dataset.alt='';this.src=x}else this.remove()" alt="">`};

/* ===== geometria ===== */
const geo={};
async function geoBR(){
  if(geo.br)return geo.br;
  const g=await fetch(`${IBGE}/paises/BR?formato=application/vnd.geo+json&qualidade=minima&intrarregiao=UF`).then(r=>r.json());
  return geo.br=project(g.features.map(f=>({id:IBGE2UF[f.properties.codarea],geom:f.geometry})));
}
async function geoUF(uf){
  if(geo[uf])return geo[uf];
  if(uf==='zz')return geo.zz=await zzTiles();
  const g=await fetch(`${IBGE}/estados/${UFS[uf][1]}?formato=application/vnd.geo+json&qualidade=minima&intrarregiao=municipio`).then(r=>r.json());
  return geo[uf]=project(g.features.map(f=>({id:f.properties.codarea,geom:f.geometry})));
}
/* exterior: uma peça por cidade, em ordem alfabética */
async function zzTiles(){
  const mu=[...await muniList('zz')].sort((a,b)=>a.nm.localeCompare(b.nm));
  const C=13,R=Math.ceil(mu.length/C),pt=88,pb=150,W=800,pad=20,pr=118,g=3;
  const w=(W-pad-pr-(C-1)*g)/C,h=Math.min(w*.78,(800-pt-pb-(R-1)*g)/R),oy=pt+((800-pt-pb)-(R*h+(R-1)*g))/2;
  const sh=n=>{n=n.replace(/^(SAO|SÃO|SANTA|SAN|LOS|LAS|LA|EL|NOVA|NEW)\s/i,m=>m[0]+'. ');return n.length>9?n.slice(0,8)+'.':n};
  return mu.map((m,i)=>{const c=i%C,r=Math.floor(i/C),x=pad+c*(w+g),y=oy+r*(h+g);
    return {id:m.cdi,d:`M${x.toFixed(1)} ${y.toFixed(1)}h${w.toFixed(1)}v${h.toFixed(1)}h${(-w).toFixed(1)}Z`,lab:sh(m.nm),cls:'zl',x:x+w/2,y:y+h/2}});
}
function project(items){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const each=(g,fn)=>{const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;polys.forEach(p=>p.forEach(r=>r.forEach(fn)))};
  items.forEach(i=>each(i.geom,([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}));
  const k=Math.cos(((y0+y1)/2)*Math.PI/180),W=800,H=800,pad=26,pt=84,pb=124;
  const sc=Math.min((W-2*pad)/((x1-x0)*k),(H-pt-pb)/(y1-y0));
  const ox=(W-(x1-x0)*k*sc)/2,oy=pt+(H-pt-pb-(y1-y0)*sc)/2;
  items.forEach(i=>{let d='';
    const polys=i.geom.type==='Polygon'?[i.geom.coordinates]:i.geom.coordinates;
    polys.forEach(p=>p.forEach(r=>{d+='M'+r.map(([x,y])=>((x-x0)*k*sc+ox).toFixed(1)+' '+((y1-y)*sc+oy).toFixed(1)).join('L')+'Z'}));
    i.d=d;});
  return items;
}

/* ===== estado ===== */
const S={turn:1,cand:null,hex:false,t2ok:false,cargo:'pres',uf:'br',mun:null,mapCargo:'pres',layer:'lider',tok:0,munList:{},fin:null,elim:[],tr:{}};
const MAJ=['pres','gov','sen'];
const isProp=cg=>cg==='df'||cg==='de';
const cargoNome=(cg,uf)=>cg==='de'&&uf==='df'?'Dep. Distrital':CARGOS[cg].nome;
const muniList=async uf=>{
  if(S.munList[uf])return S.munList[uf];
  const cm=await getJ(`${BASE}/6257/config/mun-e006257-cm.jws`);
  for(const a of cm.abr){S.munList[a.cd]=a.mu;if(a.cd==='zz')a.mu.forEach(m=>{m.cdi='x'+m.cd})}
  return S.munList[uf]||[];
};
const munCd=ibge=>{const m=(S.munList[S.uf]||[]).find(x=>x.cdi===ibge);return m?m.cd:null};
const munNm=cd=>{for(const u in S.munList){const m=S.munList[u].find(x=>x.cd===cd&&(S.uf==='br'||u===S.uf));if(m)return m.nm}return ''};
const K=(cg,uf,m,t)=>`${(t||S.turn)===2?'2/':''}${uf}:${cg}${m?':'+m:''}`;
const AUTO_PROP=['ac','ap','rr','ro','es','se','am','ms'];
const defMap=()=>(S.uf==='br'||MAJ.includes(S.cargo))?S.cargo:(AUTO_PROP.includes(S.uf)?S.cargo:'gov');
const simCg=()=>S.uf==='br'?'pres':'gov';
const need=()=>S.layer==='pxg'?['pres','gov']:S.layer==='sim'?[simCg()]:S.layer==='cand'&&S.cand?[S.cand.cg]:[S.mapCargo];

/* ===== UI estática ===== */
const tabs=$('tabs');
Object.entries(CARGOS).forEach(([k,c])=>{const b=document.createElement('button');b.textContent=c.nome;b.dataset.k=k;b.onclick=()=>go({cargo:k});tabs.appendChild(b)});
const sel=$('ufsel');sel.innerHTML='<option value="br">Brasil</option>'+[...UFKEYS].sort((a,b)=>UFS[a][0].localeCompare(UFS[b][0])).map(k=>`<option value="${k}">${UFS[k][0]}</option>`).join('')+'<option value="zz">Exterior</option>';
sel.onchange=()=>go({uf:sel.value,mun:null});
$('bWorld').onclick=()=>go(S.uf==='zz'?{uf:'br',mun:null}:{uf:'zz',mun:null,cargo:'pres'});

const tip=$('tip');
function showTip(e,h){tip.innerHTML=h;tip.style.opacity=1;const w=tip.offsetWidth,x=Math.min(e.clientX+16,innerWidth-w-12);tip.style.left=x+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-12)+'px'}
const hideTip=()=>tip.style.opacity=0;

function go(p){
  const pc0=S.cargo,pu0=S.uf;
  Object.assign(S,p);
  if(S.layer==='cand'&&p.layer===undefined&&((p.cargo!==undefined&&p.cargo!==pc0)||(p.uf!==undefined&&p.uf!==pu0))){S.cand=null;S.layer='lider'}
  if(S.turn===2&&S.cargo!=='pres'&&S.cargo!=='gov')S.cargo='pres';
  if(S.uf==='zz'){S.cargo='pres';if(S.layer==='pxg'||S.layer==='sim')S.layer='lider'}
  if(S.turn===2&&(S.layer==='pxg'||S.layer==='sim'))S.layer='lider';
  if(S.turn===1&&(S.layer==='desl'||S.layer==='abstvar'||S.layer==='virada'))S.layer='lider';
  if(S.turn===2&&S.layer==='virada'&&S.cargo==='gov'&&govDone(S.uf))S.layer='lider';
  if(S.turn===2&&S.layer==='abstvar'&&S.cargo==='gov'&&govDone(S.uf))S.layer='lider';
  if(S.turn===2&&S.layer==='desl'&&S.cargo==='gov'&&govDone(S.uf))S.layer='lider';
  if(S.layer==='cand'&&!S.cand)S.layer='lider';
  if(S.layer==='decisivo'&&isProp(S.cargo))S.layer='lider';
  if(S.uf==='br'&&isProp(S.cargo)&&S.layer!=='cand')S.layer='lider';
  if(S.uf==='br'||MAJ.includes(S.cargo))S.mapCargo=S.cargo;
  else if(p.cargo!==undefined||p.uf!==undefined||!(MAJ.includes(S.mapCargo)||S.mapCargo===S.cargo))S.mapCargo=defMap();
  if(S.layer==='sim')S.mapCargo=simCg();
  if(S.layer==='cand')S.mapCargo=S.cand.cg;
  history.replaceState(null,'','#/'+S.uf+'/'+S.cargo+(S.mun?'/'+S.mun:'')+(S.layer!=='lider'&&S.layer!=='cand'?';l='+S.layer:'')+(S.turn===2?';t=2':''));
  render();
}
function fromHash(){
  const m=location.hash.match(/^#\/([a-z]{2})\/(pres|gov|sen|df|de)(?:\/(\d+))?/);
  if(m){S.uf=m[1]==='br'||UFS[m[1]]?m[1]:'br';S.cargo=m[2];S.mun=m[3]||null;S.mapCargo=defMap();
    const l=location.hash.match(/;l=(\w+)/);if(l&&LAYERS.some(x=>x[0]===l[1])&&l[1]!=='cand'&&l[1]!=='desl'&&l[1]!=='abstvar'&&l[1]!=='virada')S.layer=l[1];
    S.wantT2=/;t=2/.test(location.hash)}
}

/* ===== render ===== */
async function render(fresh){

  {const tt=S.turn===2?'2º turno':'1º turno';document.title='Apuração 2026 · '+tt;const md=document.querySelector('meta[name=description]');if(md)md.content='Painel de apuração 2026 ('+tt+'), com dados do TSE. Desenvolvido por Luciano Victor com apoio de IA (Claude, Anthropic).'}
  const nomeUF=S.uf==='br'?'Brasil':UFS[S.uf][0];

  else if(isProp(S.cargo)&&!['pxg','sim','desl','cand','virada'].includes(S.layer)){sw.style.display='flex';sw.innerHTML=['gov',S.cargo].map(k=>{const heavy=isProp(k)&&!AUTO_PROP.includes(S.uf);return `<button data-k="${k}" class="${k===S.mapCargo?'on':''}" title="${isProp(k)?'Candidato mais votado em cada município'+(heavy?' (carrega um arquivo por município, pode levar alguns minutos)':''):''}">${isProp(k)?'Candidato mais votado':'Partido do '+cargoNome(k,S.uf).toLowerCase()}${heavy?' (pesado)':''}</button>`}).join('');sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.mapCargo=b.dataset.k;render()})}
  else sw.style.display='none';
  if(fresh!==true){$('layerBox').innerHTML='';S.simBuilt=false}
  await Promise.allSettled([drawMap(tok,fresh),drawCards(tok,fresh)]);
  renderTrend();

   <div class="presets"><button data-p="zero">Zerar</button><button data-p="prop">Proporcional</button><button data-p="a">Tudo ${esc(A.nm.split(' ')[0])}</button><button data-p="b">Tudo ${esc(B.nm.split(' ')[0])}</button></div>
   <div class="simrows">${rows}</div>
   <p class="sm mut" style="margin-top:12px;line-height:1.45">Cada eliminado repassa a parcela indicada dos votos válidos que teve no 1º turno; o restante vira abstenção, branco ou nulo. Os votos dos finalistas se mantêm. É um cenário, não uma previsão.</p></div>`;
  box.querySelectorAll('input[type=range]').forEach(inp=>inp.oninput=()=>{
    const k=inp.dataset.k,i=+inp.dataset.i,t=S.tr[k]=S.tr[k]||[0,0];t[i]=+inp.value;
    const o=1-i;if(t[0]+t[1]>100)t[o]=100-t[i];
    for(const j of [0,1]){$('v'+j+k).textContent=t[j]+'%';box.querySelector(`input[data-k="${k}"][data-i="${j}"]`).value=t[j]}

  });
  box.querySelectorAll('.presets button').forEach(b=>b.onclick=()=>{
    const p=b.dataset.p,tot=A.v+B.v||1;
    for(const k of Object.keys(S.tr))S.tr[k]=p==='zero'?[0,0]:p==='a'?[100,0]:p==='b'?[0,100]:[Math.round(A.v/tot*100),100-Math.round(A.v/tot*100)];
    simBuild();repaint();
  });
  simOut();
}

function listRows(rows,fn){return `<div class="rk">${rows.map(fn).join('')}</div>`}
const rowU=(nome,val,sub)=>`<div class="it"><span class="pos"></span><span class="nm">${esc(nome)}</span><span class="pc">${val}</span><div class="vt">${sub}</div></div>`;

    for(const u of a){const g=leaders[K('gov',u.uf,S.uf==='br'?null:u.id)];if(!g)continue;if(u.l.sg===g.sg)eq++;else df++;const k=u.l.sg+' → '+g.sg;pairs[k]=(pairs[k]||0)+1}

     <div style="margin-top:14px">${listRows(top,([k,n])=>`<div class="it"><span class="pos"></span><span class="nm">${esc(k)}</span><span class="pc">${n}</span><div class="b"><div class="bar"><i style="width:${n/top[0][1]*100}%;background:var(--acc)"></i></div></div></div>`)}</div>
     <p class="sm mut" style="margin-top:10px">Listrado no mapa: partido líder para Presidente → partido líder para Governador.</p></div>`;

  }

  if(L==='margem'){
    const R=[...U].sort((x,y)=>x.l.mg-y.l.mg),tight=R.filter(r=>r.l.mg<5).length;
    box.innerHTML=`<div class="card"><h3><span>Disputas apertadas · ${cn}</span><span>${U.length}/${M}</span></h3>

     <div style="margin-top:14px">${listRows(R.slice(0,6),r=>rowU(r.nome,r.l.mg.toFixed(2).replace('.',',')+' p.p.',`${fmt(r.l.mv)} votos · ${esc(r.l.nm)} (${esc(r.l.sg)})`))}</div></div>`;
  }else if(L==='decisivo'){
    const UU=U,r50=UU.length&&decRule(S.mapCargo,UU[0].uf)==='50',lbl=r50?'distância até 50%':'margem';
    const R=UU.map(u=>({...u,t:decThr(u.l,S.mapCargo,u.uf)})).filter(u=>u.l.nv>u.t).map(u=>({...u,r:u.l.nv/Math.max(1,u.t)})).sort((x,y)=>y.r-x.r);
    let nat='';
    if(S.uf==='br'&&S.mapCargo==='pres'){const d=cache.get(brpres())?.d;if(d){const cs=cands(d),v=votos(d),nv=v.vb+v.vn;if(cs.length>1&&cs[0].v>0){const t=decRule('pres',null)==='50'?Math.abs(2*cs[0].v-v.vv):cs[0].v-cs[1].v,sup=nv>t;
      nat=`<div style="padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)"><div class="sm mut" style="margin-bottom:6px">Brasil, o número que decide</div><div class="row sm"><span>Brancos e nulos</span><b class="num">${fmt(nv)}</b></div><div class="row sm" style="margin-top:4px"><span>${r50?'Distância do líder até 50% dos válidos':'Diferença entre os finalistas'}</span><b class="num">${fmt(t)}</b></div><div class="sm" style="margin-top:8px;color:${sup?'var(--warn)':'var(--tx2)'}">${sup?(r50?'Brancos e nulos poderiam ter mudado a existência de 2º turno.':'Brancos e nulos superam a diferença entre os finalistas.'):(r50?'Brancos e nulos não alcançam a distância até 50%.':'A diferença entre os finalistas é maior que brancos e nulos.')} O mapa por UF é detalhamento: a eleição é decidida no total nacional.</div></div>`}}}
    const off=offN();

     <div class="big">${R.length}</div><div class="mut sm" style="margin-top:6px">${w} em que brancos e nulos somados superam ${r50?'a distância do líder até a metade dos votos válidos':'a '+lbl+' da vitória'}${off?` · ${off} ${w} definidas no 1º turno ficam fora`:''}</div>
     <div style="margin-top:14px">${listRows(R.slice(0,6),r=>rowU(r.nome,r.r.toFixed(1).replace('.',',')+'×',`${fmt(r.l.nv)} brancos+nulos · ${lbl} de ${fmt(r.t)} votos`))}</div></div>`;
  }else if(L==='abst'){
    const te=U.reduce((s,u)=>s+u.l.te,0)||1,m=U.reduce((s,u)=>s+u.l.abs*u.l.te,0)/te,R=[...U].sort((x,y)=>y.l.abs-x.l.abs);

     <div style="margin-top:14px"><div class="sm mut" style="margin-bottom:6px">Maiores</div>${listRows(R.slice(0,4),r=>rowU(r.nome,pc(r.l.abs,1),`${fmt(r.l.te)} eleitores`))}</div>
     <div style="margin-top:12px"><div class="sm mut" style="margin-bottom:6px">Menores</div>${listRows(R.slice(-4).reverse(),r=>rowU(r.nome,pc(r.l.abs,1),`${fmt(r.l.te)} eleitores`))}</div></div>`;
  }
}

/* ===== cards ===== */
const skel=n=>Array.from({length:n},()=>`<div class="card"><div class="sk" style="width:40%;margin-bottom:14px"></div><div class="sk" style="height:34px;width:70%"></div></div>`).join('');
async function drawCards(tok,fresh){
  const L=$('colL'),R=$('mainBox');
  if(!L.innerHTML||fresh!==true){L.innerHTML=skel(3);R.innerHTML=skel(3)}
  try{
    if(S.uf==='br'&&S.cargo!=='pres')return await cardsNational(tok,fresh);
    const d=S.uf==='br'?await getJ(brpres(),fresh):(S.mun?await getMun(S.uf,S.mun,S.cargo,fresh):await getUF(S.uf,S.cargo,fresh));
    if(tok!==S.tok)return;
    cardsFor(d);
    if(S.uf==='br'&&S.cargo==='pres')extCard(tok,fresh);
  }catch(e){
    if(tok!==S.tok)return;
    $('dot').classList.add('err');
    /* atualização periódica: mantém os últimos números válidos na tela e só sinaliza a falha */
    if(fresh===true&&L.querySelector('.card')&&!L.querySelector('.sk')&&!L.querySelector('.card.err')){$('stamp').title='A última leitura do TSE falhou; nova tentativa em até 45 segundos. Os números exibidos são da leitura anterior.';return}
    const code=/^\d{3}$/.test(e.message)?' (código '+e.message+')':'';
    L.innerHTML=`<div class="card err">${S.turn===2&&e.message==='404'?'Sem 2º turno nesta disputa, ou dados ainda não publicados.':'Não foi possível ler o TSE agora'+code+'. Nova tentativa automática em até 45 segundos.'}</div>`;R.innerHTML=''}
}
const stTxt=x=>isEl(x.st)?'<span class="pill ok">Eleito</span>':/2º/.test(x.st)?'<span class="pill t2">2º turno</span>':'';

const partyList=(title,ps,fmtv,sub)=>{const mp=Math.max(...ps.map(x=>x.p),1);return `<div class="card"><h3><span>${title}</span><span>${sub||''}</span></h3><div class="rk">${ps.map(x=>`<div class="it"><span class="pos"></span><span class="nm">${esc(x.sg)}</span><span class="pc">${fmtv(x)}</span><div class="b">${bar(x.p,mp,x.sg)}</div></div>`).join('')}</div></div>`};
function effCard(pv,seats,vagas){
  const tot=Object.values(pv).reduce((a,b)=>a+b,0)||1;
  const rows=Object.entries(pv).map(([sg,v])=>({sg,v,pv:v/tot*100,s:seats[sg]||0})).sort((a,b)=>b.v-a.v);
  const sem=rows.filter(r=>!r.s).reduce((a,r)=>a+r.v,0);
  const top=rows.slice(0,10);
  return `<div class="card"><h3><span>Votos × cadeiras</span><span>${vagas} vagas</span></h3>
   <div class="big" style="font-size:28px">${pc(sem/tot*100,1)}</div><div class="mut sm" style="margin:6px 0 14px">dos votos nominais foram para partidos sem nenhuma cadeira (${fmt(sem)})</div>
   <div class="eff">${top.map(r=>{const sp=vagas?r.s/vagas*100:0,d=sp-r.pv;return `<div class="er"><b>${esc(r.sg)}</b>
     <div class="eb"><div class="bar"><i style="width:${r.pv*2.2}%;background:${colorOf(r.sg)}"></i></div><div class="bar"><i style="width:${sp*2.2}%;background:#e8edf7"></i></div></div>
     <span class="num ${d>=0?'up':'dn'}">${d>=0?'+':''}${d.toFixed(1).replace('.',',')}</span><span class="vt num">${r.s?fmt(r.v/r.s)+' votos/cadeira':'sem cadeira'}</span></div>`}).join('')}</div>
   <p class="sm mut" style="margin-top:10px;line-height:1.4">Barra colorida: % dos votos nominais. Barra branca: % das cadeiras. Número: diferença em pontos percentuais.</p></div>`;
}
function cardsFor(d){
  const nomeUF=S.uf==='br'?'Brasil':UFS[S.uf][0];
  const scope=S.mun?munNm(S.mun):nomeUF;
  $('colL').innerHTML=leftCards(cargoNome(S.cargo,S.uf),scope,sec(d),eleit(d),votos(d));
  const cs=cands(d),maj=CARGOS[S.cargo].maj,vagas=N(d.carg?.[0]?.nv);
  const top=cs.slice(0,maj?8:12),lead=cs[0],sg2=cs[1];
  let hero='',parts='';
  const zero=!(lead&&lead.v>0);
  if(maj&&lead&&zero){
    hero=`<div class="card"><h3><span>Liderança</span><span>${vagas?vagas+(vagas>1?' vagas':' vaga'):''}</span></h3><div class="sm" style="line-height:1.5">Ainda não há votos apurados${S.turn===2?' no 2º turno':''}. A liderança aparece com a primeira atualização do TSE após o início da apuração.</div></div>`;
  }else if(maj&&lead){
    hero=`<div class="card"><h3><span>Liderança</span><span>${vagas?vagas+(vagas>1?' vagas':' vaga'):''}</span></h3>
    <div class="hero"><div class="av" style="background:${colorOf(lead.sg)}"><span>${esc(ini(lead.nm))}</span>${img(S.cargo,S.uf,lead.sq,'avi')}</div>
    <div style="min-width:0"><div style="font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(lead.nm)}</div><div class="mut sm">${esc(lead.sg)} · ${esc(lead.n)}</div>${stTxt(lead)}</div>
    <div class="sp"></div><div style="text-align:right"><div class="big" style="font-size:30px">${pc(lead.p)}</div><div class="mut sm num">${fmt(lead.v)}</div></div></div>
    ${sg2?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)" class="row sm"><span class="mut">Diferença para ${esc(sg2.nm)}</span><b class="num">${fmt(lead.v-sg2.v)} votos · ${(lead.p-sg2.p).toFixed(2).replace('.',',')} p.p.</b></div>`:''}</div>`;
  }else if(!maj){
    const ps=partidos(d);const pl=ps[0];
    if(pl)hero=`<div class="card"><h3><span>Partido mais votado</span><span>${vagas} vagas</span></h3>
    <div class="hero"><div class="av" style="background:${colorOf(pl.sg)}"><span>${esc(pl.sg.slice(0,3))}</span></div>
    <div style="min-width:0"><div style="font-weight:700;font-size:16px">${esc(pl.sg)}</div><div class="mut sm">${esc(pl.nm||'')}</div><span class="pill">${d.__el?.[pl.sg]||0} eleitos</span></div>

const HEX={rr:[2,0],ap:[4,0],am:[1,1],pa:[3,1],ma:[4,1],ce:[5,1],rn:[6,1],ac:[0,2],ro:[1,2],mt:[2,2],to:[3,2],pi:[4,2],pe:[5,2],pb:[6,2],ms:[1,3],go:[2,3],df:[3,3],ba:[4,3],se:[5,3],al:[6,3],sp:[2,4],mg:[3,4],es:[4,4],pr:[2,5],rj:[4,5],sc:[2,6],rs:[2,7]};
function hexItems(){

  const ox=(800-Ww)/2+w/2,oy=pt+(H-Hh)/2+R;

/* ===== deslocamento 1º → 2º turno ===== */
function deslVal(uf,m){
  const cg=S.mapCargo;if(cg==='gov'&&govDone(uf))return null;const l2=leaders[K(cg,uf,m,2)],l1=leaders[K(cg,uf,m,1)];
  if(!l2||!l1||!l2.all||!l1.all)return null;
  let A,B;if(S.fin){A=S.fin[0];B=S.fin[1]}else{const t=l2.all;if(t.length<2)return null;A=t[0];B=t[1]}
  const v=(l,x)=>{const e=l.all.find(y=>y.n===x.n);return e?e.v:0};
  const a1=v(l1,A),b1=v(l1,B),a2=v(l2,A),b2=v(l2,B);
  if(a1+b1<=0||a2+b2<=0)return null;
  const s1=a1/(a1+b1)*100,s2=a2/(a2+b2)*100;
  return{d:s2-s1,s1,s2,a1,b1,a2,b2,sgA:A.sg,nmA:A.nm,sgB:B.sg,nmB:B.nm};
}

}

function viradaBox(box){

async function projBox(box){

    if(!l.sec)continue;any=true;const f=l.sec/100,tot=l.all.reduce((a,c)=>a+c.v,0)||1,rem=tot*(1-f)/f;
    for(const c of l.all){const sh=c.v/tot,x=per[c.n]=per[c.n]||{nm:c.nm,sg:c.sg,cur:0,proj:0,lo:0,hi:0};x.cur+=c.v;x.proj+=c.v+sh*rem;x.lo+=c.v+Math.max(0,sh-DV)*rem;x.hi+=c.v+Math.min(1,sh+DV)*rem}}

  const all=Object.values(per),tp=all.reduce((a,x)=>a+x.proj,0)||1,tc=all.reduce((a,x)=>a+x.cur,0)||1,arr=all.sort((a,b)=>b.proj-a.proj).slice(0,3);

function jacSvg(a,big){

  const vals=[];a.forEach(q=>q.c.forEach(c=>{if(use.includes(c[0]))vals.push(c[3])}));
  let y0=Math.min(...vals,50)-2,y1=Math.max(...vals,50)+2;y0=Math.max(0,Math.floor(y0/5)*5);y1=Math.min(100,Math.ceil(y1/5)*5);
  const X=p=>L+(p-x0)/(x1-x0||1)*(W-L-Rg),Y=v=>T+(1-(v-y0)/(y1-y0||1))*(H-T-B);

  for(let p=x0;p<=100;p+=(100-x0)>40?20:10)g+=`<text x="${X(p).toFixed(1)}" y="${H-B+14}" fill="#5d6b88" font-size="${big?10:8.5}" text-anchor="middle">${p}%</text>`;
  if(y0<50&&y1>50)g+=`<line x1="${L}" x2="${W-Rg}" y1="${Y(50).toFixed(1)}" y2="${Y(50).toFixed(1)}" stroke="#9aa8c4" stroke-dasharray="4 4" stroke-opacity=".6"/>`;

    g+=P.map(([q,v])=>`<circle cx="${X(q.p).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${big?3:2.2}" fill="${c}" stroke="#0f1420" stroke-width="1"><title>${esc(meta[sq].nm)}: ${pc(v,2)} · ${pc(q.p,2)} das seções · TSE ${esc(q.h)}</title></circle>`).join('');
    const lv=P[P.length-1][1],ly=Y(lv);g+=`<text x="${W-Rg+8}" y="${(ly+(i===0?(lv>=val(a[a.length-1],use[1])?-6:6):(lv>val(a[a.length-1],use[0])?-6:6))).toFixed(1)}" fill="${c}" font-size="${big?12:9.5}" font-weight="700" dominant-baseline="central">${pc(lv,big?2:1)} ${esc(meta[sq].nm.split(' ')[0])}</text>`});

function parlSvg(set){

  const radii=Array.from({length:rows},(_,i)=>r0+(1-r0)*i/(rows-1));
  const sr=radii.reduce((a,b)=>a+b,0);const counts=radii.map(r=>Math.round(tot*r/sr));counts[rows-1]+=tot-counts.reduce((a,b)=>a+b,0);
  const dots=[];radii.forEach((r,i)=>{const n=counts[i];for(let j=0;j<n;j++)dots.push({th:n===1?Math.PI/2:Math.PI-j*Math.PI/(n-1),r})});
  dots.sort((a,b)=>b.th-a.th||a.r-b.r);
  const R=140,cx=150,cy=150,gap=R*(1-r0)/Math.max(rows-1,1),arc=Math.PI*R/Math.max(counts[rows-1]-1,1),dr=Math.max(1.2,Math.min(gap*.42,arc*.46));

const GOV={set:null};
function govSet(rows){
  const it=rows.map(r=>{const c=r.cs[0];if(!c)return null;const el=!!c.e;const t2=!el&&(S.turn===2?!govDone(r.uf):r.cs.slice(0,2).some(x=>/2º/.test(x.st)));
    return {...c,uf:r.uf,el,t2,tag:el?'eleito':t2?'2º turno':'em apuração',nm:c.nm}}).filter(Boolean);
  const g={};it.forEach(x=>{(g[x.sg]=g[x.sg]||[]).push(x)});
  const grp=Object.entries(g).map(([sg,a])=>{a.sort((p,q)=>(q.el-p.el)||q.v-p.v);return [sg,a]}).sort((a,b)=>b[1].filter(x=>x.el).length-a[1].filter(x=>x.el).length||b[1].length-a[1].length);
  const seats=[];grp.forEach(([sg,a])=>a.forEach(x=>seats.push(x)));
  return {seats,grp,el:it.filter(x=>x.el).length,t2:it.filter(x=>x.t2).length};
}
function govMini(rows){
  const s=GOV.set=govSet(rows);if(!s.seats.length)return '';
  const W=28,G=4,C=9;
  const sv=s.seats.map((x,i)=>{const cx=(i%C)*(W+G),cy=Math.floor(i/C)*(W+G),col=colorOf(x.sg);
    return `<g data-i="${i}" style="cursor:pointer"><rect x="${cx}" y="${cy}" width="${W}" height="${W}" rx="6" fill="${col}" fill-opacity="${x.el?1:.28}" stroke="${col}" stroke-width="1.6" ${x.el?'':'stroke-dasharray="3 2"'}/><text x="${cx+W/2}" y="${cy+W/2+3}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${x.el?'#05070c':'#e8edf7'}" style="pointer-events:none">${x.uf.toUpperCase()}</text></g>`}).join('');
  const h=Math.ceil(s.seats.length/C)*(W+G)-G;
  const leg=s.grp.map(([sg,a])=>{const e=a.filter(x=>x.el).length,t=a.length-e;return `<span><i style="background:${colorOf(sg)}"></i>${esc(sg)} <span class="num" style="color:var(--tx3)">${e}${t?' +'+t:''}</span></span>`}).join('');
  return `<div class="card" id="govm"><h3><span>Governadores por partido</span><span>${s.el} eleitos${s.t2?' · '+s.t2+' em 2º turno':''}</span></h3><svg class="psv" viewBox="0 0 ${C*(W+G)-G} ${h}" style="width:100%">${sv}</svg><div class="legend2">${leg}</div>${s.seats.some(x=>!x.el)?'<div class="mut sm" style="margin-top:8px">Tracejado: líder em disputa de 2º turno ou em apuração. Clique para abrir o estado.</div>':''}</div>`;
}
function bindGov(){const el=$('govm');if(!el||!GOV.set)return;bindSeats(el,GOV.set);
  el.onclick=e=>{const t=e.target.closest('[data-i]');if(!t)return;const s=GOV.set.seats[+t.dataset.i];if(s)go({uf:s.uf,cargo:'gov',mun:null})}}
const clearCand=()=>go({cand:null,layer:'lider',cargo:S.cargo});

/* ===== atualização periódica ===== */
let next=45;
setInterval(()=>{
  next--;$('foot').textContent=next>0?`próxima leitura em ${next}s`:'lendo…';
  if(next>0)return;next=45;
  if(!S.t2ok)probeT2();
  else if(S.turn===1&&!S.autoT2&&new Date()>=T2_DATE){S.autoT2=true;go({turn:2,mun:null});return}
  render(true).catch(()=>$('dot').classList.add('err'));
  jacPull().catch(()=>{});
},1000);

fromHash();
window.__T={S,go,cache,leaders,render,deslVal,candUnits,candShare,mkSet,hexItems,probeT2};
muniList('sp').catch(()=>{}).finally(()=>{loadCfg().finally(()=>{render().finally(prefetch);probeT2()});loadGovT2()});

</script>
